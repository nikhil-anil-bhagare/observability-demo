receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  transform/logs:
    error_mode: ignore

    log_statements:
      - context: log
        statements:
          # pino puts the service name on every record; Loki indexes it as a
          # label (see otlp_config in loki-config.yaml).
          - set(attributes["service"], resource.attributes["service.name"])
            where attributes["service"] == nil

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]

    logs:
      receivers: [otlp]
      processors: [transform/logs, batch]
      exporters: [otlphttp/loki]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
